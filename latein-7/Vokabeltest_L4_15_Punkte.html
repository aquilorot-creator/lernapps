<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vokabeltest L4</title><style>body{font:1.05rem/1.55 system-ui;max-width:50rem;margin:auto;padding:1rem;background:#edf3f8;color:#183149}header,fieldset,aside{padding:1rem;margin:0 0 1rem;border:1px solid #b2c6d8;border-radius:.6rem;background:white}legend{font-weight:bold}label{display:block;margin:.5rem 0}input,select,button{font:inherit;padding:.45rem;border:1px solid #61798d;border-radius:.35rem}input{width:min(90%,25rem)}button{background:#174b76;color:white;cursor:pointer;margin:.25rem}.ok{color:#14532d}.bad{color:#991b1b}</style><main><header><h1>Vokabeltest · Lektion 4</h1><p>Jeder Test hat 15 Antwortfelder. Jede richtige Bedeutung und jedes richtige Genus zählen je 1 Punkt. Deutsche Artikel sind optional.</p><p id="status"></p><details><summary>Notenschlüssel</summary>Note 1: 14–15 · Note 2: 11–13 · Note 3: 8–10 · Note 4: 5–7 · Note 5: 2–4 · Note 6: 0–1</details><noscript>Bitte die HTML-Datei herunterladen und direkt in einem Browser mit aktiviertem JavaScript öffnen.</noscript></header><aside id="score" tabindex="-1" aria-live="polite" hidden></aside><div id="questions"></div><button id="check" type="button">Test auswerten</button><button id="next" type="button" hidden></button><button id="reset" type="button">Lernzyklus zurücksetzen</button></main><script>
const data=[["homō", "m", ["Mensch", "Mann", "Leute"], 1, "der Mensch; der Mann; Pl. auch die Leute"], ["sedēre", "", ["sitzen", "dasitzen"], 1, "(da)sitzen"], ["diū", "", ["lange"], 1, "lange"], ["spectāculum", "n", ["das Schauspiel", "die Veranstaltung", "die Vorführung"], 1, "das Schauspiel; die Veranstaltung; die Vorführung"], ["cōnsul", "m", ["der Konsul"], 1, "der Konsul (höchster röm. Beamter)"], ["avus", "m", ["der Großvater"], 1, "der Großvater"], ["modo", "", ["gerade", "gerade eben", "nur", "einmal", "mal"], 1, "gerade (eben); nur; (ein)mal"], ["autem", "", ["aber", "doch", "jedoch"], 1, "aber, (je)doch"], ["vidēre", "", ["sehen"], 1, "sehen"], ["imperātor", "m", ["der Kaiser", "der Feldherr"], 1, "der Kaiser; der Feldherr"], ["avē!", "", ["sei gegrüßt!"], 1, "sei gegrüßt!"], ["populus", "m", ["das Volk", "das Publikum"], 1, "das Volk; das Publikum"], ["verbum", "n", ["das Wort"], 1, "das Wort"], ["simulācrum", "n", ["das Bild"], 1, "das Bild"], ["deus", "m", ["der Gott"], 1, "der Gott"], ["rēx", "m", ["der König"], 1, "der König"], ["rēgīna", "f", ["die Königin"], 1, "die Königin"], ["dea", "f", ["die Göttin"], 1, "die Göttin"], ["amor", "m", ["die Liebe"], 1, "die Liebe"], ["spectāre", "", ["anschauen", "schauen", "betrachten"], 1, "(an)schauen; betrachten"], ["initium", "n", ["der Anfang", "der Beginn"], 1, "der Anfang, der Beginn"], ["sīgnum", "n", ["das Zeichen", "das Merkmal"], 1, "das Zeichen; das Merkmal"], ["dare", "", ["geben", "von sich geben"], 1, "(von sich) geben"], ["incitāre", "", ["antreiben", "anfeuern"], 1, "antreiben, anfeuern"], ["ārdor", "m", ["das Temperament", "die Begeisterung", "die Hitze"], 1, "das Temperament; die Begeisterung; die Hitze"], ["clāmor", "m", ["der Schrei", "der Ruf", "das Geschrei"], 1, "der Schrei, der Ruf; das Geschrei"], ["furor", "m", ["das Toben", "der Wahnsinn", "die Raserei"], 1, "das Toben; der Wahnsinn; die Raserei"], ["neque", "", ["und nicht", "auch nicht", "aber nicht"], 1, "und … nicht; auch … nicht; aber … nicht"]], $=x=>document.getElementById(x), root=$('questions'), check=$('check'), next=$('next'), score=$('score'), key='latein15-L4', genders={m:'Maskulinum',f:'Femininum',n:'Neutrum'};
const cost=i=>data[i][3]+Number(!!data[i][1]);
function subsets(ids){const dp=Array(16).fill(null);dp[0]=[];for(const id of ids)for(let j=15;j>=cost(id);j--)if(!dp[j]&&dp[j-cost(id)])dp[j]=[...dp[j-cost(id)],id];return dp;}
function plan(order){let todo=order.slice(),seen=[],tests=[];while(todo.length){const a=subsets(todo),b=subsets(seen);let k=15;while(k>0&&(!a[k]||!b[15-k]))k--;if(!k)throw Error('Keine passende Testkombination');const used=a[k],items=used.concat(b[15-k]),chosen=new Set(used);tests.push({items,used});todo=todo.filter(id=>!chosen.has(id));seen.push(...used);}return tests;}
function fresh(){const ids=data.map((_,i)=>i);for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]];}return {tests:plan(ids),done:0,points:0,seen:0};}
let s;try{s=JSON.parse(localStorage.getItem(key));}catch{}if(!s||!Array.isArray(s.tests)||!Number.isInteger(s.done)||s.done<0||s.done>s.tests.length)s=fresh();
function save(){try{localStorage.setItem(key,JSON.stringify(s));}catch{}$('status').textContent=`${s.seen} von ${data.length} Vokabelaufgaben mindestens einmal abgefragt · ${s.done} von ${s.tests.length} Tests ausgewertet`;}
const norm=x=>x.toLowerCase().normalize('NFC').replace(/ß/g,'ss').replace(/[!?.,…–—-]/g,' ').trim().replace(/^(der|die|das|ein|eine)\s+/,'').replace(/\s+/g,' ');
const note=p=>p>=14?1:p>=11?2:p>=8?3:p>=5?4:p>=2?5:6;
let tasks=[];
function render(){save();root.replaceChildren();score.hidden=true;next.hidden=true;check.hidden=false;tasks=[];const t=s.tests[s.done];if(!t){finish();return;}let count=0;t.items.forEach((id,i)=>{const [w,g,answers,n,display]=data[id],box=document.createElement('fieldset'),legend=document.createElement('legend');legend.textContent=w+(i>=t.used.length?' (Wiederholung)':'');box.append(legend);const entries=[];for(let j=0;j<n;j++){const label=document.createElement('label'),input=document.createElement('input');label.textContent=`${++count}. Bedeutung${n>1?' '+(j+1):''} `;input.autocomplete='off';label.append(input);box.append(label);entries.push(input);}let select;if(g){const label=document.createElement('label');label.textContent=`${++count}. Lateinisches Genus `;select=document.createElement('select');select.add(new Option('Bitte wählen',''));for(const [k,v] of Object.entries(genders))select.add(new Option(v,k));label.append(select);box.append(label);}const feedback=document.createElement('div');box.append(feedback);root.append(box);tasks.push({box,entries,select,g,answers,display,feedback});});}
function finish(){check.hidden=true;next.hidden=false;next.textContent='Neuen Lernzyklus starten';score.hidden=false;score.textContent=`Lernzyklus abgeschlossen: ${s.points} von ${15*s.done} Punkten in ${s.done} Tests.`;}
check.onclick=()=>{if(check.hidden||!tasks.length)return;let points=0;for(const t of tasks){const used=new Set();function line(text,ok){const d=document.createElement('div');d.textContent=text;d.className=ok?'ok':'bad';t.feedback.append(d);}t.entries.forEach((el,i)=>{const a=norm(el.value),ok=!!a&&!used.has(a)&&t.answers.some(v=>norm(v)===a);if(ok)used.add(a);points+=Number(ok);line('Bedeutung'+(t.entries.length>1?' '+(i+1):'')+': '+(ok?'richtig':used.has(a)?'bereits gewertet':a?'nicht erkannt':'keine Eingabe'),ok);});line('Lösung: '+t.display,true);if(t.select){const ok=t.select.value===t.g;points+=Number(ok);line('Genus: '+(ok?'richtig':'nicht richtig oder leer')+' · Lösung: '+genders[t.g],ok);}t.box.disabled=true;}s.seen+=s.tests[s.done].used.length;s.done++;s.points+=points;save();check.hidden=true;next.hidden=false;const last=s.done===s.tests.length;next.textContent=last?'Neuen Lernzyklus starten':'Nächsten Test starten';score.hidden=false;score.textContent=`Test ${s.done}: ${points} von 15 Punkten · Note ${note(points)}.`+(last?` Lernzyklus abgeschlossen: ${s.points} von ${15*s.done} Punkten.`:'');score.focus();};
next.onclick=()=>{if(s.done===s.tests.length)s=fresh();render();root.querySelector('input')?.focus();};$('reset').onclick=()=>{if(confirm('Fortschritt wirklich zurücksetzen?')){s=fresh();render();}};render();</script></html>
